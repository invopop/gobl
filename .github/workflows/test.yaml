name: Test Go
on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:
jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The three most recent Go releases. The oldest matches the go
        # directive in go.mod, and 1.27 is the first release to enable the
        # jsonv2 implementation of encoding/json by default.
        go-version: ["1.25.x", "1.26.x", "1.27.x"]
        include:
          - go-version: "1.27.x"
            coverage: true

    env:
      # Run on the toolchain the matrix installed instead of downloading a
      # newer one when a module in the graph asks for it.
      GOTOOLCHAIN: local

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install Dependencies
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: go mod download

      - name: Test
        # -coverpkg=./... credits coverage across package boundaries, so code
        # exercised through integration tests (e.g. the golden-example suite
        # driving normalization and validation) is counted for the packages
        # that own it, not only by each package's own unit tests.
        run: go test -race -coverprofile=coverage.out -covermode=atomic -coverpkg=./... ./...

      - name: Upload coverage reports to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v5.1.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # Skipping WASM test, this can be done by CLI
      #- name: Test WASM
      #  run: GOOS=js GOARCH=wasm go test ./... -exec=$(go env GOROOT)/misc/wasm/go_js_wasm_exec
