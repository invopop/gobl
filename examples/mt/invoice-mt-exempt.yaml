# Exempt-without-credit supply.
#
# Insurance services are "exempt without credit" under the Fifth Schedule,
# Part Two (item 2): no VAT is charged and the supplier cannot recover input VAT.
# In GOBL this maps to the "exempt" combo key (no percentage), distinct from the
# zero-rated "exempt with credit" case.
# Source: MTCA VAT Rates & Exemptions FAQs (Fifth Schedule Part Two),
# https://mtca.gov.mt/docs/default-source/documents/business-tax/vat/faqs/vat-rates-and-exemptions---faqs.pdf
