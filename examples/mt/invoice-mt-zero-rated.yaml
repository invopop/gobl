# Zero-rated (exempt-with-credit) supply.
#
# Food for human consumption is "exempt with credit" under the Fifth Schedule,
# Part One (item 9): no VAT is charged, but the supplier keeps the right to
# recover input VAT. In GOBL this maps to the "zero" combo key, not "exempt".
# Source: MTCA VAT Rates & Exemptions FAQs (Fifth Schedule Part One),
# https://mtca.gov.mt/docs/default-source/documents/business-tax/vat/faqs/vat-rates-and-exemptions---faqs.pdf
