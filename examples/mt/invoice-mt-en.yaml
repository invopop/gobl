# A domestic Maltese B2B invoice exercising three of the four positive VAT rates.
# The item descriptions are drawn from the Eighth Schedule to the VAT Act so the
# rates can be checked against the statute rather than taken on trust:
#   - consultancy       -> no Schedule entry, so the 18% residual rate of art. 19(1)
#   - securities custody -> Eighth Schedule item 12, 12%
#   - accommodation      -> Eighth Schedule item 1, 7%
