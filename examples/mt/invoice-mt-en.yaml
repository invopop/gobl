  name: "Baystreet Advisory Ltd"
  tax_id:
    country: "MT"
    code: "11679112"
  addresses:
    - num: "42"
      street: "Triq ir-Repubblika"
      locality: "Valletta"
      code: "VLT 1117"
      country: "MT"
  emails:
    - addr: "billing@example.mt"

customer:
  name: "Marsaxlokk Holdings Ltd"
  tax_id:
    country: "MT"
    code: "12345634"
  addresses:
    - num: "8"
      street: "Triq il-Kbira"
      locality: "Birkirkara"
