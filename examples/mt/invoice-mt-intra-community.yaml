# An intra-Community supply from Malta to a VAT-registered customer in Ireland.
#
# This is the case that makes Malta's exemption vocabulary worth modelling. Item 3
# of Part One of the Fifth Schedule to the VAT Act makes intra-Community supplies
# "exempt with credit": no VAT is charged, but the supplier keeps the right to
# deduct input tax under article 22(4). That is not the same as an exempt supply
# in GOBL's sense, which is Part Two of the same Schedule and carries no right of
# deduction. The intra-community key expresses the first; the exempt key would
# wrongly express the second.
